[package]
name = "console-oft"
version = "0.1.0"
description = "Console OFT program for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "console_oft"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["custom-heap"]
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "oapp/idl-build",
    "rbac/idl-build",
]
custom-heap = []
custom-panic = []
anchor-debug = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    "cfg(feature, values(\"custom-heap\", \"custom-panic\", \"anchor-debug\"))",
] }

[dependencies]
anchor-lang = { version = "1.0.2", features = ["event-cpi", "init-if-needed"] }
anchor-spl = { version = "1.0.2" }
oapp = { path = "../../dependencies/oapp-solana-contracts" }
oft = { path = "../../dependencies/oft-solana-contracts" }
rbac = { path = "../../dependencies/utils-solana-rbac" }
borsh = {version = "=1.6.1", features = ["derive"] }
num_enum = { version = "0.7", default-features = false }
solana-address-lookup-table-interface = "3.0.1"
solana-helper = "0.1.0"
solana-keccak-hasher = "3.1.0"
spl-token-2022 = {version = "10.0.0", features = ["no-entrypoint"] }
spl-tlv-account-resolution = "0.11.1"
spl-transfer-hook-interface = "2.1.0"
spl-discriminator = "0.5.2"
spl-type-length-value = "0.9.1"

[dev-dependencies]
mollusk-svm = { version = "0.12", features = ["inner-instructions"] }
mollusk-svm-programs-token = { version = "0.12", default-features = false, features = ["token-2022"] }
mollusk-svm-result = { version = "0.12", features = ["inner-instructions"] }
solana-account = "3.4"
solana-instruction = "3.2"
solana-program-error = "3.0"
solana-program-option = "3.1.0"
solana-program-pack = "3.1.0"
solana-pubkey = "4.1"
spl-token-2022 = { version = "10.0", features = ["no-entrypoint"] }
