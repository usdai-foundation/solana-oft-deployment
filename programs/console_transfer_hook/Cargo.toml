[package]
name = "console-transfer-hook"
version = "1.0.0"
authors = ["LayerZero Labs", "Shankar (@shankars99)"]
edition = "2021"
description = "Console Transfer Hook - Compliance logic for Console tokens on Solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "console_transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "rbac/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["event-cpi", "init-if-needed"] }
anchor-spl = { version = "1.0.2" }
num_enum = { version = "0.7", default-features = false }
rbac = { path = "../../dependencies/utils-solana-rbac" }
solana-helper = "0.1.0"
spl-discriminator = "0.5.2"
spl-type-length-value = { version = "0.9.1", features = ["derive"] }
spl-transfer-hook-interface = "2.1.0"
spl-tlv-account-resolution = "0.11.1"
spl-token-2022 = { version = "10.0", features = ["no-entrypoint"] }

[dev-dependencies]
futures = "0.3"
mollusk-svm = { version = "0.12", features = ["inner-instructions"] }
mollusk-svm-programs-token = { version = "0.12", default-features = false, features = ["token-2022"] }
mollusk-svm-result = { version = "0.12", features = ["inner-instructions"] }
solana-account = "3.4"
solana-instruction = "3.2"
solana-program-error = "3.0"
solana-pubkey = "4.1"
spl-pod = "0.7"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    "cfg(feature, values(\"custom-heap\", \"custom-panic\", \"anchor-debug\"))",
] }
