[package]
name = "oapp"
version = "0.1.0"
edition = "2021"

[features]
default = []
idl-build = [ "anchor-lang/idl-build", "anchor-spl/idl-build", "oapp-macros/idl-build" ]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [ "cfg(target_os, values(\"solana\"))" ]

[dependencies]
solana-keccak-hasher = "3.1.0"
spl-discriminator = "0.5.2"

[dependencies.anchor-lang]
version = "1.0.2"

[dependencies.anchor-spl]
version = "1.0.2"

[dependencies.oapp-macros]
path = "macros"

[dependencies.solana-address-lookup-table-interface]
version = "3.0.1"
features = [ "bincode", "bytemuck" ]

[dependencies.spl-type-length-value]
version = "0.9.1"
features = [ "derive" ]
